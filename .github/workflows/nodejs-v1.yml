name: nodejs-v1

on:
  push:
    paths:
      - 'implementations/nodejs/v1/**'
      - '.github/workflows/nodejs-v1.yml'
  pull_request:
    paths:
      - 'implementations/nodejs/v1/**'

defaults:
  run:
    working-directory: implementations/nodejs/v1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
